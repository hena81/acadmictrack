<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول الأدمن</title>
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                sans: ["Tahoma", "Arial", "sans-serif"]
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-900">
    <main class="flex min-h-screen items-center justify-center bg-white px-4 py-10">
      <section class="w-full max-w-md">
        <div class="w-full max-w-md">
          <a href="index.html" class="mb-8 flex items-center gap-3">
            <img class="school-logo h-14 w-14 rounded-xl border border-slate-200 object-contain p-1" src="assets/logo.svg" alt="شعار المدرسة" />
            <div>
              <p class="text-sm text-slate-500">لوحة التحكم</p>
              <h1 class="school-name text-xl font-bold text-slate-950">مدرسة المستقبل الثانوية</h1>
            </div>
          </a>

          <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
            <div class="mb-6">
              <p class="text-sm font-semibold text-teal-700">تسجيل الدخول</p>
              <h2 class="mt-1 text-2xl font-bold text-slate-950">مرحبًا بك</h2>
            </div>

            <form id="loginForm" class="space-y-4">
              <label class="block">
                <span class="mb-2 block text-sm font-semibold text-slate-700">اسم المستخدم</span>
                <input name="username" autocomplete="username" class="h-12 w-full rounded-lg border border-slate-300 px-4 outline-none transition focus:border-teal-500 focus:ring-4 focus:ring-teal-100" placeholder="admin" />
              </label>
              <label class="block">
                <span class="mb-2 block text-sm font-semibold text-slate-700">كلمة المرور</span>
                <input name="password" type="password" autocomplete="current-password" class="h-12 w-full rounded-lg border border-slate-300 px-4 outline-none transition focus:border-teal-500 focus:ring-4 focus:ring-teal-100" placeholder="••••••••" />
              </label>
              <button id="loginButton" class="inline-flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-teal-700 px-5 font-bold text-white shadow-sm transition hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-60">
                <i data-lucide="log-in" class="h-5 w-5"></i>
                دخول
              </button>
            </form>
            <div id="loginAlert" class="mt-5"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/shared.js?v=20260510"></script>
    <script src="js/admin-login.js?v=20260510"></script>
  </body>
</html>
